{% extends 'base.html' %}
{% block page_title %}Add Purchase Order{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('purchase_orders') }}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><span class="card-title">Create Purchase Order</span></div>
  <form method="POST" style="padding:24px;">
    <div class="form-grid">
      <div class="form-group">
        <label>Supplier *</label>
        <select name="supplier_id" required>
          <option value="">Select Supplier</option>
          {% for s in suppliers %}
          <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Vehicle *</label>
        <select name="vehicle_id" required>
          <option value="">Select Vehicle</option>
          {% for v in vehicles %}
          <option value="{{ v.id }}">{{ v.make }} {{ v.model }} ({{ v.year }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label>Quantity *</label>
        <input type="number" name="qty" value="1" min="1" required onchange="calculateTotal()">
      </div>
      <div class="form-group">
        <label>Unit Cost (₹) *</label>
        <input type="number" step="0.01" name="unit_cost" required onchange="calculateTotal()">
      </div>
      <div class="form-group">
        <label>Total Cost (₹)</label>
        <input type="number" step="0.01" id="total-cost" name="total_cost" readonly>
      </div>
      <div class="form-group">
        <label>Expected Delivery</label>
        <input type="date" name="expected_delivery">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select name="status">
          <option value="ordered">Ordered</option>
          <option value="confirmed">Confirmed</option>
          <option value="received">Received</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-top:16px;">
      <label>Notes</label>
      <textarea name="notes" rows="3" placeholder="Additional notes"></textarea>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
      <button type="submit" class="btn btn-primary"><i class="fa fa-boxes-stacked"></i> Create Order</button>
      <a href="{{ url_for('purchase_orders') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% block scripts %}
<script>
function calculateTotal() {
  const qty = parseFloat(document.querySelector('[name=qty]').value) || 0;
  const unitCost = parseFloat(document.querySelector('[name=unit_cost]').value) || 0;
  const total = qty * unitCost;
  document.getElementById('total-cost').value = total.toFixed(2);
}

document.addEventListener('DOMContentLoaded', function() {
  calculateTotal();
});
</script>
{% endblock %}
{% endblock %}
