{% extends 'base.html' %}
{% block page_title %}{{ action }} User{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('users') }}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><span class="card-title">{{ action }} User</span></div>
  <form method="POST" style="padding:24px;">
    <div class="form-grid">
      <div class="form-group">
        <label>Username *</label>
        <input name="username" value="{{ user.username if user else '' }}" required placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Password *</label>
        <input type="password" name="password" required placeholder="Enter password">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select name="role">
          <option value="customer" {% if user and user.role=='customer' %}selected{% endif %}>Customer</option>
          <option value="manager" {% if user and user.role=='manager' %}selected{% endif %}>Manager</option>
          <option value="admin" {% if user and user.role=='admin' %}selected{% endif %}>Admin</option>
        </select>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:24px;">
      <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> {{ action }} User</button>
      <a href="{{ url_for('users') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
