{% extends 'base.html' %}
{% block page_title %}{{ action }} Supplier{% endblock %}
{% block topbar_actions %}<a href="{{ url_for('suppliers') }}" class="btn btn-secondary"><i class="fa fa-arrow-left"></i> Back</a>{% endblock %}
{% block content %}
<div class="card">
  <div class="card-header"><span class="card-title">{{ action }} Supplier</span></div>
  <form method="POST" style="padding:24px;">
    <div style="margin-bottom:20px;">
      <div style="font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;"><i class="fa fa-building"></i> Company Info</div>
      <div class="form-grid">
        <div class="form-group"><label>Name *</label><input name="name" value="{{ supplier.name if supplier else '' }}" required placeholder="Company name"></div>
        <div class="form-group"><label>Contact Name</label><input name="contact_name" value="{{ supplier.contact_name if supplier else '' }}" placeholder="Primary contact person"></div>
        <div class="form-group"><label>Email *</label><input type="email" name="email" value="{{ supplier.email if supplier else '' }}" required placeholder="contact@company.com"></div>
        <div class="form-group"><label>Phone *</label><input name="phone" value="{{ supplier.phone if supplier else '' }}" required placeholder="Phone number"></div>
        <div class="form-group"><label>GSTIN</label><input name="gstin" value="{{ supplier.gstin if supplier else '' }}" placeholder="GST number"></div>
        <div class="form-group"><label>Rating</label><input type="number" step="0.1" min="1" max="5" name="rating" value="{{ supplier.rating if supplier else 5 }}" placeholder="1-5"></div>
      </div>
    </div>

    <div style="margin-bottom:20px;">
      <div style="font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;"><i class="fa fa-map-marker-alt"></i> Address</div>
      <div class="form-grid">
        <div class="form-group"><label>Address</label><input name="address" value="{{ supplier.address if supplier else '' }}" placeholder="Street address"></div>
        <div class="form-group"><label>City</label><input name="city" value="{{ supplier.city if supplier else '' }}" placeholder="City"></div>
        <div class="form-group"><label>State</label><input name="state" value="{{ supplier.state if supplier else '' }}" placeholder="State"></div>
      </div>
    </div>

    <div style="margin-bottom:24px;">
      <div style="font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;"><i class="fa fa-handshake"></i> Business Terms</div>
      <div class="form-grid">
        <div class="form-group"><label>Payment Terms</label><input name="payment_terms" value="{{ supplier.payment_terms if supplier else '30 days' }}" placeholder="e.g., 30 days, Net 60"></div>
      </div>
    </div>

    <div style="display:flex;gap:10px;">
      <button type="submit" class="btn btn-primary"><i class="fa fa-save"></i> {{ action }} Supplier</button>
      <a href="{{ url_for('suppliers') }}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
