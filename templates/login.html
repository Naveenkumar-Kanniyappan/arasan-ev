<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Arasan EV CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:#0a0f1a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 0%, #00d4aa12 0%, transparent 70%);pointer-events:none;}
.login-box{background:#111827;border:1px solid #1f2d45;border-radius:20px;padding:44px;width:100%;max-width:400px;position:relative;}
.brand{text-align:center;margin-bottom:36px;}
.brand .icon{font-size:40px;margin-bottom:10px;}
.brand h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#00d4aa;}
.brand p{font-size:13px;color:#64748b;margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:11.5px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px;}
.form-group .input-wrap{position:relative;}
.form-group .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#64748b;font-size:13px;}
.form-group input{width:100%;background:#1a2235;border:1px solid #1f2d45;border-radius:10px;padding:11px 13px 11px 38px;color:#e2e8f0;font-size:14px;outline:none;transition:.2s;font-family:'DM Sans',sans-serif;}
.form-group input:focus{border-color:#00d4aa;box-shadow:0 0 0 3px #00d4aa12;}
.btn-login{width:100%;background:#00d4aa;color:#000;border:none;border-radius:10px;padding:13px;font-family:'Syne',sans-serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:.2s;letter-spacing:.3px;}
.btn-login:hover{opacity:.85;}
.alert{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.alert-error{background:#ef444412;border:1px solid #ef444428;color:#ef4444;}
.hint{text-align:center;font-size:12px;color:#64748b;margin-top:20px;}
</style>
</head>
<body>
<div class="login-box">
  <div class="brand">
    <h1>Arasan EV CRM</h1>
    <p>Electric Vehicle Management Platform</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for cat, msg in messages %}<div class="alert alert-{{ cat }}"><i class="fa fa-exclamation-circle"></i>{{ msg }}</div>{% endfor %}{% endif %}
  {% endwith %}
  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <div class="input-wrap">
        <i class="fa fa-user"></i>
        <input type="text" name="username" placeholder="Enter username" required autofocus>
      </div>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <i class="fa fa-lock"></i>
        <input type="password" name="password" placeholder="Enter password" required>
      </div>
    </div>
    <button type="submit" class="btn-login">Sign In →</button>
  </form>
</div>
</body>
</html>
